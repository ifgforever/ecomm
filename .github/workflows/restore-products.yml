# One-shot: writes products-restore.json into PRODUCTS_KV through the site's
# own admin API. Run by hand from the Actions tab, never on a schedule.
#
# This exists because 327 products lost their photos when the legacy /images/
# folder was deleted while they still referenced it. The images were recovered
# from images_originals_backup/, re-uploaded to R2 under legacy/, and relinked
# in this file. 37 products with no recoverable photo were removed.
#
# Delete this workflow and products-restore.json once it has run.

name: Restore product images

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the payload before writing
        run: |
          count=$(python3 -c "import json;print(len(json.load(open('products-restore.json'))))")
          bad=$(python3 -c "import json;d=json.load(open('products-restore.json'));print(sum(1 for p in d if not (p.get('image') or '').startswith('http')))")
          echo "products: $count   non-absolute images: $bad"
          if [ "$count" -lt 700 ] || [ "$bad" -ne 0 ]; then
            echo "Refusing to write: payload looks wrong."
            exit 1
          fi

      - name: Write to KV via the admin API
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X PUT \
            -H "Content-Type: application/json" \
            -H "Cookie: admin_auth=${ADMIN_KEY}" \
            --data-binary @products-restore.json \
            "https://jinkittys.com/api/products")
          echo "HTTP $code"
          cat /tmp/out.txt
          [ "$code" = "200" ] || exit 1

      - name: Confirm it took
        run: |
          sleep 5
          live=$(curl -sS "https://jinkittys.com/api/products" | python3 -c "import sys,json;print(len(json.load(sys.stdin)))")
          echo "live product count: $live"
