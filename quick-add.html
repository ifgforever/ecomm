<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Quick Add — Jojin's Kitty Thrift</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🐾</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #1c1610;
    --ink-soft: #6b5d4f;
    --paper: #f7f2eb;
    --paper-warm: #f0e9de;
    --tan: #d4c4a8;
    --amber: #c8863a;
    --amber-dark: #a06820;
    --teal: #3d7a6e;
    --rust: #b8522a;
    --card: #ffffff;
    --r: 4px;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Karla', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    padding-bottom: 40px;
  }
  .wrap { max-width: 420px; margin: 0 auto; padding: 40px 20px 20px; }

  h1 {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 900;
    text-align: center;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; color: var(--amber-dark); }
  .sub {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13.5px;
    margin: 0 0 28px;
  }

  .card {
    background: var(--card);
    border: 1.5px solid var(--tan);
    border-radius: var(--r);
    padding: 24px;
    box-shadow: 5px 5px 0 var(--amber);
  }

  .dropzone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 2px dashed var(--tan);
    border-radius: var(--r);
    padding: 30px 14px;
    cursor: pointer;
    background: var(--paper-warm);
    text-align: center;
  }
  .dropzone input { display: none; }
  .dropzone .thumb {
    width: 100%;
    max-width: 220px;
    aspect-ratio: 1;
    border-radius: 6px;
    background: var(--paper);
    background-size: cover;
    background-position: center;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }
  .dropzone .txt { font-size: 13px; color: var(--ink-soft); font-weight: 600; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 20px 0 6px;
  }
  input[type="number"] {
    width: 100%;
    font-family: var(--font-body);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    background: var(--paper-warm);
    border: 1px solid var(--tan);
    border-radius: var(--r);
    padding: 12px 14px;
  }

  .submit-btn {
    width: 100%;
    margin-top: 24px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    background: var(--teal);
    border: none;
    border-radius: var(--r);
    padding: 14px;
    cursor: pointer;
  }
  .submit-btn:disabled { opacity: .55; cursor: default; }

  .err {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--rust);
    display: none;
    text-align: center;
  }

  .success {
    display: none;
    text-align: center;
    padding: 30px 10px;
  }
  .success .big { font-size: 40px; margin-bottom: 10px; }
  .success h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 8px; }
  .success p { color: var(--ink-soft); font-size: 14px; }
  .success button {
    margin-top: 18px;
    background: none;
    border: 2px solid var(--teal);
    color: var(--teal);
    font-weight: 700;
    border-radius: var(--r);
    padding: 10px 18px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Quick <em>Add</em></h1>
    <p class="sub">Snap it, price it, done — details get finished later.</p>

    <div class="card" id="formCard">
      <label class="dropzone" tabindex="0">
        <div class="thumb" id="thumb">📷</div>
        <span class="txt" id="dropText">Tap to take a photo</span>
        <input type="file" accept="image/*" capture="environment" id="photoInput" />
      </label>

      <label>Price</label>
      <input type="number" id="priceInput" placeholder="0" min="0" step="1" inputmode="decimal" />

      <label>Quantity</label>
      <input type="number" id="qtyInput" value="1" min="1" step="1" inputmode="numeric" />

      <button class="submit-btn" id="submitBtn">Add It</button>
      <div class="err" id="errBox"></div>
    </div>

    <div class="success" id="successBox">
      <div class="big">✅</div>
      <h2>Added!</h2>
      <p id="successMsg">It's live in inventory now.</p>
      <button id="addAnotherBtn">+ Add Another</button>
    </div>
  </div>

<script>
(function () {
  const photoInput = document.getElementById('photoInput');
  const thumb = document.getElementById('thumb');
  const dropText = document.getElementById('dropText');
  const priceInput = document.getElementById('priceInput');
  const qtyInput = document.getElementById('qtyInput');
  const submitBtn = document.getElementById('submitBtn');
  const errBox = document.getElementById('errBox');
  const formCard = document.getElementById('formCard');
  const successBox = document.getElementById('successBox');
  const successMsg = document.getElementById('successMsg');
  const addAnotherBtn = document.getElementById('addAnotherBtn');

  let base64 = null;
  let mediaType = null;
  let photoPreparing = false;

  photoInput.addEventListener('change', async () => {
    const file = photoInput.files && photoInput.files[0];
    if (!file) return;

    clearError();
    base64 = null;
    photoPreparing = true;
    submitBtn.disabled = true;
    dropText.textContent = 'Preparing photo…';

    try {
      const prepared = await preparePhoto(file);
      base64 = prepared.dataUrl.split(',')[1];
      mediaType = prepared.mediaType;
      thumb.style.backgroundImage = `url("${prepared.dataUrl}")`;
      thumb.textContent = '';
      dropText.textContent = 'Tap to retake';
    } catch {
      showError("Couldn't prepare that photo. Try taking it again.");
      thumb.style.backgroundImage = '';
      thumb.textContent = '📷';
      dropText.textContent = 'Tap to take a photo';
    } finally {
      photoPreparing = false;
      submitBtn.disabled = false;
    }
  });

  function readAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(reader.error || new Error('Photo read failed'));
      reader.readAsDataURL(file);
    });
  }

  function loadImage(source) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('Photo decode failed'));
      image.src = source;
    });
  }

  function canvasToBlob(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob(
        (blob) => blob ? resolve(blob) : reject(new Error('Photo conversion failed')),
        'image/jpeg',
        0.86
      );
    });
  }

  async function preparePhoto(file) {
    const originalDataUrl = await readAsDataUrl(file);

    try {
      const image = await loadImage(originalDataUrl);
      const maxSide = 1600;
      const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

      const context = canvas.getContext('2d');
      if (!context) throw new Error('Canvas unavailable');
      context.drawImage(image, 0, 0, canvas.width, canvas.height);

      const jpegBlob = await canvasToBlob(canvas);
      return {
        dataUrl: await readAsDataUrl(jpegBlob),
        mediaType: 'image/jpeg',
      };
    } catch {
      // If an older phone cannot use canvas for this format, keep the
      // original photo and let the server return a specific format error.
      return {
        dataUrl: originalDataUrl,
        mediaType: file.type || 'image/jpeg',
      };
    }
  }

  function showError(msg) {
    errBox.textContent = msg;
    errBox.style.display = 'block';
  }
  function clearError() {
    errBox.style.display = 'none';
    errBox.textContent = '';
  }

  async function submit() {
    clearError();
    if (photoPreparing) return showError('Wait for the photo to finish preparing.');
    if (!base64) return showError('Take a photo first.');
    if (!priceInput.value) return showError('Enter a price.');

    submitBtn.disabled = true;
    submitBtn.textContent = 'Adding & drafting with AI…';

    try {
      const endpoint = new URL('/api/quick-intake-submit', window.location.origin);
      const res = await fetch(endpoint.href, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ price: priceInput.value, quantity: qtyInput.value || 1, mediaType, base64 }),
      });

      const responseText = await res.text();
      let data = {};
      try {
        data = responseText ? JSON.parse(responseText) : {};
      } catch {
        throw new Error(`The server returned an unreadable response (${res.status})`);
      }
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);

      const qtyNote = Number(qtyInput.value) > 1 ? ` ×${qtyInput.value}` : '';
      successMsg.textContent = data.merged
        ? `Already listed as "${data.name}" (${data.id}) — quantity is now ${data.quantity}.`
        : (data.name ? `"${data.name}" is live — $${priceInput.value}${qtyNote}` : 'It\'s live in inventory now.');
      formCard.style.display = 'none';
      successBox.style.display = 'block';
    } catch (err) {
      showError(`Couldn't add it (${err.message}). Try again.`);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Add It';
    }
  }

  submitBtn.addEventListener('click', submit);

  addAnotherBtn.addEventListener('click', () => {
    base64 = null;
    mediaType = null;
    photoInput.value = '';
    thumb.style.backgroundImage = '';
    thumb.textContent = '📷';
    dropText.textContent = 'Tap to take a photo';
    priceInput.value = '';
    qtyInput.value = '1';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Add It';
    formCard.style.display = 'block';
    successBox.style.display = 'none';
  });
})();
</script>
</body>
</html>
