<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Community Listings Review — Jojin's Kitty Thrift</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🐾</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #E3D1AA;
    --paper-dark: #C2A16E;
    --card: #F7F0E0;
    --ink: #2B2420;
    --ink-soft: #6B5A45;
    --stamp: #A63A2E;
    --thread: #6E7C5E;
    --gold: #B08A3E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Libre Baskerville', serif;
    color: var(--ink);
    background: var(--paper);
    padding-bottom: 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--stamp);
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Special Elite', monospace;
    font-size: 24px;
    margin: 0 0 4px;
  }
  .sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 24px;
  }

  h2.section {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 28px 0 12px;
  }

  .card {
    background: var(--card);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 4px 10px rgba(43,36,32,0.12);
    display: flex;
    gap: 12px;
  }
  .card img {
    width: 76px; height: 76px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--paper);
    border: 1px solid var(--paper-dark);
  }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-size: 14px; font-weight: 700; margin: 0 0 3px; }
  .card .desc { font-size: 13px; margin: 0 0 4px; }
  .card .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .card .actions { display: flex; gap: 8px; }
  .card button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .approve-btn { background: var(--thread); color: #fff; }
  .reject-btn, .remove-btn { background: var(--stamp); color: #fff; }

  .empty {
    color: var(--ink-soft);
    font-size: 13px;
    padding: 10px 2px;
  }

  .toast {
    position: fixed;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    background: var(--thread);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    display: none;
    z-index: 20;
  }
  .toast.error { background: var(--stamp); }
</style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="wrap">
    <p class="eyebrow">Community listings</p>
    <h1>Review Submissions</h1>
    <p class="sub">These are from other people, not shop inventory — approve what fits, skip what doesn't.</p>

    <h2 class="section">Pending</h2>
    <div id="pendingList"></div>

    <h2 class="section">Live on the site</h2>
    <div id="approvedList"></div>
  </div>

<script>
(function () {
  const pendingList = document.getElementById('pendingList');
  const approvedList = document.getElementById('approvedList');
  const toastEl = document.getElementById('toast');

  let LISTINGS = [];

  function showToast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.className = 'toast' + (isError ? ' error' : '');
    toastEl.style.display = 'block';
    setTimeout(() => { toastEl.style.display = 'none'; }, 3000);
  }

  function esc(s) {
    return String(s ?? '')
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;');
  }

  function metaLine(l) {
    const parts = [];
    if (l.price != null) parts.push(`$${l.price}`);
    parts.push(l.email ? esc(l.email) : 'No contact email left');
    return parts.join(' · ');
  }

  function render() {
    const pending = LISTINGS.filter(l => !l.approved);
    const approved = LISTINGS.filter(l => l.approved);

    pendingList.innerHTML = pending.length
      ? ''
      : '<p class="empty">Nothing waiting on you right now.</p>';

    for (const l of pending) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${esc(l.image)}" alt="">
        <div class="info">
          <p class="name">${esc(l.name)}</p>
          <p class="desc">${esc(l.description || '(no description)')}</p>
          <p class="meta">${metaLine(l)}</p>
          <div class="actions">
            <button class="approve-btn" data-approve="${esc(l.id)}">✓ Approve</button>
            <button class="reject-btn" data-reject="${esc(l.id)}">✕ Skip</button>
          </div>
        </div>
      `;
      pendingList.appendChild(card);
    }

    approvedList.innerHTML = approved.length
      ? ''
      : '<p class="empty">Nothing live yet.</p>';

    for (const l of approved) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${esc(l.image)}" alt="">
        <div class="info">
          <p class="name">${esc(l.name)}</p>
          <p class="desc">${esc(l.description || '(no description)')}</p>
          <p class="meta">${metaLine(l)}</p>
          <div class="actions">
            <button class="remove-btn" data-remove="${esc(l.id)}">Remove</button>
          </div>
        </div>
      `;
      approvedList.appendChild(card);
    }

    pendingList.querySelectorAll('[data-approve]').forEach(b =>
      b.addEventListener('click', () => setApproved(b.dataset.approve, true)));
    pendingList.querySelectorAll('[data-reject]').forEach(b =>
      b.addEventListener('click', () => removeEntry(b.dataset.reject)));
    approvedList.querySelectorAll('[data-remove]').forEach(b =>
      b.addEventListener('click', () => removeEntry(b.dataset.remove)));
  }

  async function saveToCloud() {
    try {
      const res = await fetch('/api/community-listings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(LISTINGS),
      });
      if (!res.ok) throw new Error('Save failed');
    } catch (err) {
      showToast(`Couldn't save (${err.message})`, true);
    }
  }

  async function setApproved(id, value) {
    const entry = LISTINGS.find(l => l.id === id);
    if (!entry) return;
    entry.approved = value;
    render();
    await saveToCloud();
    showToast('Added to the live site');
  }

  async function removeEntry(id) {
    LISTINGS = LISTINGS.filter(l => l.id !== id);
    render();
    await saveToCloud();
    showToast('Removed');
  }

  async function load() {
    try {
      const res = await fetch('/api/community-listings', { cache: 'no-store' });
      LISTINGS = await res.json();
      render();
    } catch (err) {
      pendingList.innerHTML = `<p class="empty">Couldn't load submissions (${esc(err.message)}).</p>`;
    }
  }

  load();
})();
</script>
</body>
</html>
