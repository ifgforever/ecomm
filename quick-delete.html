<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Quick Delete — Jojin's Kitty Thrift</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🐾</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #1c1610;
    --ink-soft: #6b5d4f;
    --paper: #f7f2eb;
    --paper-warm: #f0e9de;
    --tan: #d4c4a8;
    --amber: #c8863a;
    --amber-dark: #a06820;
    --teal: #3d7a6e;
    --rust: #b8522a;
    --card: #ffffff;
    --r: 4px;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Karla', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    padding-bottom: 24px;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap { max-width: 420px; margin: 0 auto; padding: 28px 20px 20px; }

  .navlink {
    display: block;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--teal);
    text-decoration: none;
    margin-bottom: 16px;
  }
  .navlink:hover { text-decoration: underline; }

  h1 {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 900;
    text-align: center;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; color: var(--rust); }
  .sub {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13.5px;
    margin: 0 0 16px;
  }

  /* Mode switch — swipe one at a time, or pick several off a grid. */
  .modes {
    display: flex;
    border: 1.5px solid var(--tan);
    border-radius: var(--r);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .modes button {
    flex: 1;
    font-family: var(--font-body);
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--card);
    border: none;
    padding: 11px 6px;
    cursor: pointer;
  }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .count {
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 14px;
    min-height: 15px;
  }

  /* ---- swipe mode ---- */

  /* The card sits in a fixed-height stage so the page doesn't jump around
     as it flies off and the next one takes its place. */
  .stage {
    position: relative;
    /* Fill whatever's left after the header and buttons, so the photo is as
       big as it can be while everything still fits without scrolling. The
       dvh line is the one that counts on phones; the vh line covers older
       Safari, which ignores it. */
    height: clamp(190px, calc(100vh - 384px), 460px);
    height: clamp(190px, calc(100dvh - 384px), 460px);
    touch-action: pan-y;
  }

  .card {
    position: absolute;
    inset: 0;
    background: var(--card);
    border: 1.5px solid var(--tan);
    border-radius: var(--r);
    padding: 16px;
    box-shadow: 5px 5px 0 var(--amber);
    display: flex;
    flex-direction: column;
    cursor: grab;
  }
  .card.dragging { cursor: grabbing; }
  .card.animate { transition: transform .28s ease-out, opacity .28s ease-out; }

  .photo {
    flex: 1;
    min-height: 0;
    background: var(--paper-warm);
    border-radius: var(--r);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .photo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .photo .placeholder { font-size: 44px; }

  .meta { padding-top: 12px; text-align: center; }
  .meta .name {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 700;
    line-height: 1.25;
    margin: 0 0 4px;
    /* Long AI-written names shouldn't push the photo out of the card. */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .meta .price { font-size: 17px; font-weight: 700; color: var(--amber-dark); }
  .meta .sku {
    font-size: 11.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 4px;
  }

  /* Stamps that fade in as the card is dragged, so it's obvious which way
     is which before you let go. Anchored to the stage, not the card, so
     they stay readable while the card slides away. */
  .stamp {
    position: absolute;
    top: 18px;
    z-index: 2;
    background: var(--card);
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.06em;
    padding: 6px 12px;
    border: 3px solid;
    border-radius: var(--r);
    opacity: 0;
    pointer-events: none;
  }
  .stamp.del { left: 18px; color: var(--rust); border-color: var(--rust); transform: rotate(-12deg); }
  .stamp.keep { right: 18px; color: var(--teal); border-color: var(--teal); transform: rotate(12deg); }

  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions button {
    flex: 1;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 15px;
    border-radius: var(--r);
    padding: 14px;
    cursor: pointer;
    border: 2px solid;
  }
  .btn-del { background: var(--rust); border-color: var(--rust); color: #fff; }
  .btn-keep { background: var(--teal); border-color: var(--teal); color: #fff; }
  .actions button:disabled { opacity: .45; cursor: default; }

  /* ---- grid mode ---- */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
  }
  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1.5px solid var(--tan);
    border-radius: var(--r);
    padding: 6px;
    cursor: pointer;
    text-align: left;
    font-family: var(--font-body);
    color: var(--ink);
  }
  .tile[aria-pressed="true"] {
    border-color: var(--rust);
    box-shadow: 0 0 0 2px var(--rust);
    background: #fbf0ea;
  }
  .tile .shot {
    aspect-ratio: 1;
    background: var(--paper-warm);
    border-radius: 3px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tile .shot img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .tile .shot .placeholder { font-size: 26px; }
  .tile .tname {
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.25;
    margin-top: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tile .tprice { font-size: 12px; font-weight: 700; color: var(--amber-dark); margin-top: 3px; }
  .tile .tsku { font-size: 10px; color: var(--ink-soft); letter-spacing: 0.04em; }
  .tile .check {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--rust);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .tile[aria-pressed="true"] .check { display: flex; }

  .gridbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .gridbar .pages { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .gridbar button, .linkbtn {
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--teal);
    background: none;
    border: 1.5px solid var(--tan);
    border-radius: var(--r);
    padding: 7px 10px;
    cursor: pointer;
  }
  .gridbar button:disabled { opacity: .4; cursor: default; }

  .selbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 12px 0 0;
  }
  .selbar .linkbtn { border-color: transparent; padding: 7px 2px; }

  /* Sticky so the delete button is always in reach on a long page. */
  .batchwrap {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to top, var(--paper) 70%, transparent);
    padding: 10px 0 4px;
    margin-top: 10px;
  }
  .batch-btn {
    width: 100%;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    background: var(--rust);
    border: 2px solid var(--rust);
    border-radius: var(--r);
    padding: 14px;
    cursor: pointer;
  }
  .batch-btn:disabled { opacity: .4; cursor: default; }

  /* ---- shared ---- */

  .undo-btn {
    width: 100%;
    margin-top: 10px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    background: none;
    border: 2px solid var(--tan);
    color: var(--ink-soft);
    border-radius: var(--r);
    padding: 12px;
    cursor: pointer;
  }
  .undo-btn:disabled { opacity: .45; cursor: default; }

  .err {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--rust);
    display: none;
    text-align: center;
  }
  .note {
    display: none;
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align: center;
  }

  .msg {
    display: none;
    text-align: center;
    padding: 40px 10px;
  }
  .msg .big { font-size: 40px; margin-bottom: 10px; }
  .msg h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 8px; }
  .msg p { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .msg a.button, .msg button {
    display: inline-block;
    margin-top: 18px;
    background: none;
    border: 2px solid var(--teal);
    color: var(--teal);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    border-radius: var(--r);
    padding: 10px 18px;
    cursor: pointer;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="navlink" href="/quick-add.html">＋ Quick Add</a>

    <h1>Quick <em>Delete</em></h1>
    <p class="sub" id="sub">Swipe left to delete, right to keep.</p>

    <div class="modes" id="modes" style="display:none">
      <button type="button" id="swipeMode" aria-pressed="true">◀ Swipe</button>
      <button type="button" id="gridMode" aria-pressed="false">▦ Grid</button>
    </div>

    <p class="count" id="count"></p>

    <!-- Swipe -->
    <div id="deckBox" style="display:none">
      <div class="stage" id="stage">
        <div class="stamp del" id="delStamp">DELETE</div>
        <div class="stamp keep" id="keepStamp">KEEP</div>
      </div>

      <div class="actions">
        <button class="btn-del" id="delBtn" type="button">Delete</button>
        <button class="btn-keep" id="keepBtn" type="button">Keep</button>
      </div>
    </div>

    <!-- Grid -->
    <div id="gridBox" style="display:none">
      <div class="gridbar">
        <button type="button" id="prevBtn">‹ Older</button>
        <span class="pages" id="pageLabel"></span>
        <button type="button" id="nextBtn">Newer ›</button>
      </div>

      <div class="grid" id="grid"></div>

      <div class="selbar">
        <button class="linkbtn" type="button" id="selectPageBtn">Select all 20</button>
        <button class="linkbtn" type="button" id="clearSelBtn">Clear</button>
      </div>

      <div class="batchwrap">
        <button class="batch-btn" id="batchBtn" type="button" disabled>Delete selected</button>
      </div>
    </div>

    <div id="sharedBox" style="display:none">
      <button class="undo-btn" id="undoBtn" type="button" disabled>↩ Undo</button>
      <div class="err" id="errBox"></div>
      <div class="note" id="noteBox"></div>
    </div>

    <div class="msg" id="loadingBox" style="display:block">
      <div class="big">⏳</div>
      <h2>Loading inventory…</h2>
    </div>

    <div class="msg" id="doneBox">
      <div class="big">🎉</div>
      <h2 id="doneTitle">All done!</h2>
      <p id="doneMsg">You've been through everything.</p>
      <div>
        <button id="restartBtn" type="button">↻ Start Over</button>
      </div>
      <div>
        <a class="button" href="/quick-add.html">＋ Quick Add</a>
      </div>
    </div>
  </div>

<script>
(function () {
  const PAGE_SIZE = 20;
  // How far a card has to travel before letting go counts as a decision.
  const THRESHOLD = 90;

  const el = (id) => document.getElementById(id);
  const stage = el('stage');
  const delStamp = el('delStamp');
  const keepStamp = el('keepStamp');
  const deckBox = el('deckBox');
  const gridBox = el('gridBox');
  const sharedBox = el('sharedBox');
  const modes = el('modes');
  const swipeModeBtn = el('swipeMode');
  const gridModeBtn = el('gridMode');
  const sub = el('sub');
  const loadingBox = el('loadingBox');
  const doneBox = el('doneBox');
  const doneTitle = el('doneTitle');
  const doneMsg = el('doneMsg');
  const countEl = el('count');
  const delBtn = el('delBtn');
  const keepBtn = el('keepBtn');
  const undoBtn = el('undoBtn');
  const restartBtn = el('restartBtn');
  const errBox = el('errBox');
  const noteBox = el('noteBox');
  const grid = el('grid');
  const pageLabel = el('pageLabel');
  const prevBtn = el('prevBtn');
  const nextBtn = el('nextBtn');
  const selectPageBtn = el('selectPageBtn');
  const clearSelBtn = el('clearSelBtn');
  const batchBtn = el('batchBtn');

  let all = [];                     // everything loaded, oldest first
  let deleted = new Set();          // ids gone from inventory this session
  let selected = new Set();         // ids ticked in grid mode
  let history = [];                 // { type, entries } — newest last
  let mode = 'swipe';
  // The swipe card is tracked by id, not by position, so restoring or
  // deleting something else (in the grid) can't slide a different listing
  // under the card. swipePos is where to land if that listing is gone.
  let swipeId = null;
  let swipePos = 0;
  let page = 0;
  let card = null;
  let busy = false;

  // Everything still in inventory, oldest first. Derived rather than
  // spliced so swipe and grid always agree on what's left.
  const live = () => all.filter((p) => !deleted.has(p.id));

  // ---- data ----------------------------------------------------------

  async function load() {
    try {
      const res = await fetch('/api/products', { cache: 'no-store', credentials: 'same-origin' });
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      const data = await res.json();
      all = oldestFirst(Array.isArray(data) ? data.filter((p) => p && p.id) : []);
    } catch (err) {
      loadingBox.querySelector('.big').textContent = '⚠️';
      loadingBox.querySelector('h2').textContent = "Couldn't load inventory";
      loadingBox.insertAdjacentHTML('beforeend', `<p>${escapeHtml(err.message)}</p>`);
      return;
    }

    loadingBox.style.display = 'none';
    deleted = new Set();
    selected = new Set();
    history = [];
    swipeId = null;
    swipePos = 0;
    page = 0;
    modes.style.display = 'flex';
    render();
  }

  // Oldest first, so the stuff that's been sitting longest comes up first.
  // The catalog itself is newest-first (Quick Add unshifts onto the front),
  // so plain array order is exactly backwards for this screen.
  function oldestFirst(list) {
    return list
      .map((p, i) => ({ p, i }))
      .sort((a, b) => {
        const ta = added(a.p);
        const tb = added(b.p);
        if (ta !== tb) return ta - tb;
        // Same timestamp, or neither has one: later in the catalog is older.
        return b.i - a.i;
      })
      .map((x) => x.p);
  }

  function added(p) {
    const t = Date.parse(p.createdAt || '');
    // Listings from before createdAt existed are the oldest things here.
    return Number.isNaN(t) ? -Infinity : t;
  }

  // ---- routing between the two views ---------------------------------

  function render() {
    clearError();
    const remaining = live();

    if (!remaining.length) return finish();

    doneBox.style.display = 'none';
    sharedBox.style.display = 'block';
    modes.style.display = 'flex';

    if (mode === 'grid') {
      deckBox.style.display = 'none';
      gridBox.style.display = 'block';
      sub.textContent = 'Tap items to select, then delete them all at once.';
      renderGrid(remaining);
    } else {
      gridBox.style.display = 'none';
      deckBox.style.display = 'block';
      sub.textContent = 'Swipe left to delete, right to keep.';
      const at = swipeTarget(remaining);
      if (at === -1) return finish();
      renderCard(remaining, at);
    }
    undoBtn.disabled = busy || history.length === 0;
  }

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    swipeModeBtn.setAttribute('aria-pressed', String(next === 'swipe'));
    gridModeBtn.setAttribute('aria-pressed', String(next === 'grid'));
    clearNote();
    render();
  }

  function finish() {
    deckBox.style.display = 'none';
    gridBox.style.display = 'none';
    modes.style.display = 'none';
    doneBox.style.display = 'block';
    // Keep Undo reachable here: deleting the last item lands straight on
    // this screen, and that's exactly when you might want it back.
    sharedBox.style.display = history.length ? 'block' : 'none';
    undoBtn.disabled = busy || history.length === 0;
    countEl.textContent = '';
    sub.textContent = '';

    const gone = deleted.size;
    if (!all.length) {
      doneTitle.textContent = 'Nothing to review';
      doneMsg.textContent = 'Inventory is empty.';
    } else if (!live().length) {
      doneTitle.textContent = 'Inventory is empty';
      doneMsg.textContent = `Deleted all ${gone} item${gone === 1 ? '' : 's'}.`;
    } else {
      doneTitle.textContent = 'All done!';
      doneMsg.textContent = gone
        ? `Deleted ${gone} item${gone === 1 ? '' : 's'} out of ${all.length}.`
        : `Went through all ${all.length} items — nothing deleted.`;
    }
  }

  // ---- swipe mode ----------------------------------------------------

  // Where the swipe card is pointing: the listing itself if it's still
  // there, otherwise whatever has taken its place. -1 means we're through.
  function swipeTarget(remaining) {
    if (swipeId) {
      const i = remaining.findIndex((p) => p.id === swipeId);
      if (i !== -1) return i;
    }
    return swipePos < remaining.length ? swipePos : -1;
  }

  function renderCard(remaining, at) {
    clearNote();
    if (card) card.remove();
    delStamp.style.opacity = '0';
    keepStamp.style.opacity = '0';

    const p = remaining[at];
    swipeId = p.id;
    swipePos = at;
    countEl.textContent = `${at + 1} of ${remaining.length} left`;

    card = document.createElement('div');
    card.className = 'card';
    card.append(photoFor(p, 'photo'), metaFor(p));
    stage.appendChild(card);
    attachDrag(card);
  }

  function metaFor(p) {
    const meta = document.createElement('div');
    meta.className = 'meta';

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = p.name || 'Untitled item';

    const price = document.createElement('div');
    price.className = 'price';
    price.textContent = priceLabel(p);

    const sku = document.createElement('div');
    sku.className = 'sku';
    sku.textContent = p.id;

    meta.append(name, price, sku);
    return meta;
  }

  function attachDrag(node) {
    let startX = 0;
    let startY = 0;
    let dx = 0;
    let dragging = false;
    let pointerId = null;

    node.addEventListener('pointerdown', (e) => {
      if (busy) return;
      pointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      dx = 0;
      dragging = true;
      node.classList.add('dragging');
      node.classList.remove('animate');
      node.setPointerCapture(pointerId);
    });

    node.addEventListener('pointermove', (e) => {
      if (!dragging || e.pointerId !== pointerId) return;
      dx = e.clientX - startX;
      const dy = e.clientY - startY;
      // Mostly-vertical drags are the page scrolling, not a decision.
      if (Math.abs(dx) < 10 && Math.abs(dy) > 14) return;
      paint(dx);
    });

    function release(e) {
      if (!dragging || (e && e.pointerId !== pointerId)) return;
      dragging = false;
      node.classList.remove('dragging');
      if (pointerId !== null && node.hasPointerCapture(pointerId)) {
        node.releasePointerCapture(pointerId);
      }
      pointerId = null;

      if (dx <= -THRESHOLD) return decide('delete');
      if (dx >= THRESHOLD) return decide('keep');
      node.classList.add('animate');
      paint(0);
    }

    node.addEventListener('pointerup', release);
    node.addEventListener('pointercancel', release);

    function paint(x) {
      node.style.transform = `translateX(${x}px) rotate(${x / 22}deg)`;
      delStamp.style.opacity = x < 0 ? String(Math.min(1, -x / THRESHOLD)) : '0';
      keepStamp.style.opacity = x > 0 ? String(Math.min(1, x / THRESHOLD)) : '0';
    }
  }

  function flyOut(direction) {
    if (!card) return;
    const node = card;
    node.classList.add('animate');
    node.style.transform = `translateX(${direction * 600}px) rotate(${direction * 22}deg)`;
    node.style.opacity = '0';
    delStamp.style.opacity = '0';
    keepStamp.style.opacity = '0';
  }

  async function decide(type) {
    if (busy || mode !== 'swipe') return;
    const remaining = live();
    const at = swipeTarget(remaining);
    const product = at === -1 ? null : remaining[at];
    if (!product) return;
    clearError();
    clearNote();

    if (type === 'keep') {
      history.push({ type: 'keep', mode: 'swipe', id: product.id });
      flyOut(1);
      swipePos = at + 1;
      swipeId = remaining[at + 1] ? remaining[at + 1].id : null;
      settle();
      return;
    }

    setBusy(true);
    flyOut(-1);
    const result = await sendDelete([product.id]);
    setBusy(false);

    if (!result.ok) {
      // Nothing was deleted — put the card back where it was.
      render();
      showError(`Couldn't delete it (${result.error}). Try again.`);
      return;
    }

    result.removed.forEach((entry) => deleted.add(entry.id));
    history.push({ type: 'delete', mode: 'swipe', entries: result.removed });
    // This listing is gone, so the next one shifts into its slot.
    swipeId = null;
    swipePos = at;
    settle();
  }

  // Let the card finish flying off before the next one appears.
  function settle() {
    undoBtn.disabled = true;
    setTimeout(render, 220);
  }

  // ---- grid mode -----------------------------------------------------

  function renderGrid(remaining) {
    const pageCount = Math.max(1, Math.ceil(remaining.length / PAGE_SIZE));
    page = Math.min(Math.max(0, page), pageCount - 1);

    const start = page * PAGE_SIZE;
    const slice = remaining.slice(start, start + PAGE_SIZE);

    countEl.textContent = `${remaining.length} item${remaining.length === 1 ? '' : 's'} left`;
    pageLabel.textContent = `Page ${page + 1} of ${pageCount}`;
    prevBtn.disabled = page === 0;
    nextBtn.disabled = page >= pageCount - 1;

    grid.textContent = '';
    slice.forEach((p) => grid.appendChild(tileFor(p)));

    refreshSelectionUi();
  }

  // Just the bits that change when a tile is ticked — rebuilding the whole
  // grid on every tap would re-request 20 photos.
  function refreshSelectionUi() {
    const slice = live().slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);
    selectPageBtn.textContent = slice.length && slice.every((p) => selected.has(p.id))
      ? `Unselect these ${slice.length}`
      : `Select all ${slice.length}`;
    updateBatchButton();
  }

  function tileFor(p) {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile';
    tile.setAttribute('aria-pressed', String(selected.has(p.id)));
    tile.dataset.id = p.id;

    const name = document.createElement('div');
    name.className = 'tname';
    name.textContent = p.name || 'Untitled item';

    const price = document.createElement('div');
    price.className = 'tprice';
    price.textContent = priceLabel(p);

    const sku = document.createElement('div');
    sku.className = 'tsku';
    sku.textContent = p.id;

    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = '✓';

    tile.append(photoFor(p, 'shot'), name, price, sku, check);
    tile.addEventListener('click', () => {
      if (busy) return;
      if (selected.has(p.id)) selected.delete(p.id);
      else selected.add(p.id);
      tile.setAttribute('aria-pressed', String(selected.has(p.id)));
      refreshSelectionUi();
    });
    return tile;
  }

  function updateBatchButton() {
    const n = selected.size;
    batchBtn.disabled = busy || n === 0;
    batchBtn.textContent = n ? `Delete ${n} selected` : 'Delete selected';
    clearSelBtn.disabled = n === 0;
  }

  async function deleteSelected() {
    if (busy || !selected.size) return;
    const ids = live().filter((p) => selected.has(p.id)).map((p) => p.id);
    if (!ids.length) return;
    clearError();
    clearNote();

    setBusy(true);
    const result = await sendDelete(ids);
    setBusy(false);

    if (!result.ok) {
      showError(`Couldn't delete (${result.error}). Nothing was removed — try again.`);
      return;
    }

    result.removed.forEach((entry) => deleted.add(entry.id));
    history.push({ type: 'delete', mode: 'grid', entries: result.removed });
    selected = new Set();

    const n = result.removed.length;
    const skipped = (result.missing || []).length;
    render();
    showNote(
      `Deleted ${n} item${n === 1 ? '' : 's'}.` +
      (skipped ? ` ${skipped} ${skipped === 1 ? 'was' : 'were'} already gone.` : '') +
      ' Undo puts them back.'
    );
  }

  // ---- shared bits ---------------------------------------------------

  function photoFor(p, className) {
    const box = document.createElement('div');
    box.className = className;

    const placeholder = () => {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.textContent = '🖼️';
      return ph;
    };

    if (!p.image) {
      box.appendChild(placeholder());
      return box;
    }

    const img = document.createElement('img');
    img.src = p.image;
    img.alt = p.name || 'Product photo';
    img.loading = 'lazy';
    const rotation = ((Number(p.rotation) || 0) % 360 + 360) % 360;
    if (rotation) img.style.transform = `rotate(${rotation}deg)`;
    img.addEventListener('error', () => {
      // Broken image URL — show the same placeholder as a photo-less item
      // so the tile still says which listing this is.
      box.textContent = '';
      box.appendChild(placeholder());
    });
    box.appendChild(img);
    return box;
  }

  function priceLabel(p) {
    const qty = Number(p.quantity) || 0;
    return `$${Number(p.price) || 0}${qty > 1 ? ` · ${qty} in stock` : ''}`;
  }

  async function sendDelete(ids) {
    try {
      const res = await fetch('/api/quick-delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ ids }),
      });
      const data = await readJson(res);
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return { ok: true, removed: data.removed || [], missing: data.missing || [] };
    } catch (err) {
      return { ok: false, error: err.message };
    }
  }

  async function undo() {
    if (busy || !history.length) return;
    const last = history[history.length - 1];
    clearError();
    clearNote();

    let message;

    if (last.type === 'delete') {
      setBusy(true);
      try {
        const res = await fetch('/api/quick-delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ restore: last.entries }),
        });
        const data = await readJson(res);
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      } catch (err) {
        setBusy(false);
        showError(`Couldn't undo (${err.message}). Try again.`);
        return;
      }
      setBusy(false);

      last.entries.forEach((entry) => deleted.delete(entry.id));
      const n = last.entries.length;
      message = n === 1
        ? `Restored ${last.entries[0].id} — it's back in inventory.`
        : `Restored ${n} items — they're back in inventory.`;

      // Show the restore where it happened: the grid jumps to the page
      // holding it, and the swipe card only moves if the swipe deleted it.
      const restoredIds = new Set(last.entries.map((e) => e.id));
      const remaining = live();
      const at = remaining.findIndex((p) => restoredIds.has(p.id));
      if (at !== -1) {
        page = Math.floor(at / PAGE_SIZE);
        if (last.mode === 'swipe') {
          swipeId = remaining[at].id;
          swipePos = at;
        }
      }
    } else {
      // Undoing a keep just walks the card back to that listing.
      const remaining = live();
      const at = remaining.findIndex((p) => p.id === last.id);
      if (at === -1) {
        // It was deleted from the grid in the meantime — nothing to go back to.
        swipeId = null;
        swipePos = Math.max(0, swipePos - 1);
      } else {
        swipeId = last.id;
        swipePos = at;
        page = Math.floor(at / PAGE_SIZE);
      }
      message = 'Back to this one.';
    }

    history.pop();
    render();
    showNote(message);
  }

  function setBusy(state) {
    busy = state;
    delBtn.disabled = state;
    keepBtn.disabled = state;
    undoBtn.disabled = state || history.length === 0;
    updateBatchButton();
  }

  async function readJson(res) {
    const text = await res.text();
    try {
      return text ? JSON.parse(text) : {};
    } catch {
      throw new Error(`The server returned an unreadable response (${res.status})`);
    }
  }

  function showError(msg) {
    errBox.textContent = msg;
    errBox.style.display = 'block';
  }
  function clearError() {
    errBox.style.display = 'none';
    errBox.textContent = '';
  }
  function showNote(msg) {
    noteBox.textContent = msg;
    noteBox.style.display = 'block';
  }
  function clearNote() {
    noteBox.style.display = 'none';
    noteBox.textContent = '';
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  swipeModeBtn.addEventListener('click', () => setMode('swipe'));
  gridModeBtn.addEventListener('click', () => setMode('grid'));
  delBtn.addEventListener('click', () => decide('delete'));
  keepBtn.addEventListener('click', () => decide('keep'));
  undoBtn.addEventListener('click', undo);
  batchBtn.addEventListener('click', deleteSelected);
  prevBtn.addEventListener('click', () => { page -= 1; render(); });
  nextBtn.addEventListener('click', () => { page += 1; render(); });
  clearSelBtn.addEventListener('click', () => { selected = new Set(); render(); });
  selectPageBtn.addEventListener('click', () => {
    const remaining = live();
    const slice = remaining.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);
    const allOn = slice.every((p) => selected.has(p.id));
    slice.forEach((p) => (allOn ? selected.delete(p.id) : selected.add(p.id)));
    render();
  });
  restartBtn.addEventListener('click', () => {
    loadingBox.style.display = 'block';
    doneBox.style.display = 'none';
    load();
  });

  // Arrow keys for anyone doing this at a desk instead of on a phone.
  document.addEventListener('keydown', (e) => {
    if (mode !== 'swipe' || deckBox.style.display === 'none') return;
    if (e.key === 'ArrowLeft') decide('delete');
    else if (e.key === 'ArrowRight') decide('keep');
  });

  load();
})();
</script>
</body>
</html>
